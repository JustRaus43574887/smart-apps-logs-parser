name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ] # Замените на master, если ваша ветка называется так

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --cwd apps/web

      - name: Build web application
        run: yarn --cwd apps/web build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'apps/web/build' # Путь к папке, куда Vite складывает готовую сборку

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
